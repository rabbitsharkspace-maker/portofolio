<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    One shape, because sixteen pixels only hold one. The old mark was a shark
    with a rabbit inside a rocket — lovely at 256, a smudge in a tab. This keeps
    the same idea in a single silhouette: read it as a dorsal fin or as an ear,
    both are true. Filled tile rather than a transparent glyph, so it holds its
    own against a light or a dark tab strip.
  -->
  <rect width="32" height="32" rx="8" fill="#1e2b10" />
  <path
    d="M16 5c5 7 8 14 8 18 0 2-2 3-4 2-1.5-.8-3-1-4-1s-2.5.2-4 1c-2 1-4 0-4-2 0-4 3-11 8-18Z"
    fill="#bae722"
  />
</svg>
